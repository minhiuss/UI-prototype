# Keeps the free Render API (tradeup-api) from sleeping so the GitHub Pages demo answers fast.
# Render free sleeps after 15 min idle; GitHub may run schedules late, so ping often.
name: keep-awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://tradeup-api-s0lb.onrender.com/health
